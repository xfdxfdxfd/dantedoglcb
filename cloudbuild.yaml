steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-env-vars=DJANGO_DEBUG=false,INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE},POSTGRES_DB=${_POSTGRES_DB},POSTGRES_USER=${_POSTGRES_USER},DJANGO_ALLOWED_HOSTS=${_DJANGO_ALLOWED_HOSTS},GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID},GOOGLE_OAUTH_CLIENT_IDS=${_GOOGLE_OAUTH_CLIENT_IDS},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_MAX_NEW_TOKENS=${_GEMINI_MAX_NEW_TOKENS},GEMINI_WARM_ON_START=${_GEMINI_WARM_ON_START}
      - --set-secrets=DJANGO_SECRET_KEY=django-secret-key:latest,POSTGRES_PASSWORD=postgres-password:latest,GEMINI_API_KEY=gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}

substitutions:
  _SERVICE_NAME: dantedoglcb-backend
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: dantedoglcb
  _CLOUD_SQL_INSTANCE: your-project:your-region:your-instance
  _POSTGRES_DB: dantedoglcb
  _POSTGRES_USER: dantedoglcb
  _DJANGO_ALLOWED_HOSTS: your-service-xxxx.a.run.app
  _GOOGLE_OAUTH_CLIENT_ID: ''
  _GOOGLE_OAUTH_CLIENT_IDS: ''
  _GEMINI_MODEL: gemini-3-flash-preview
  _GEMINI_MAX_NEW_TOKENS: '192'
  _GEMINI_WARM_ON_START: '0'

options:
  logging: CLOUD_LOGGING_ONLY