steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --port=8000
      - --platform=managed
      - --allow-unauthenticated
      - --command=/app/entrypoint.sh
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_REQUEST_TIMEOUT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-env-vars=DJANGO_DEBUG=${_DJANGO_DEBUG},POSTGRES_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},POSTGRES_DB=${_POSTGRES_DB},POSTGRES_USER=${_POSTGRES_USER},DJANGO_ALLOWED_HOSTS=${_DJANGO_ALLOWED_HOSTS},GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID},GOOGLE_OAUTH_CLIENT_IDS=${_GOOGLE_OAUTH_CLIENT_IDS},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_MAX_NEW_TOKENS=${_GEMINI_MAX_NEW_TOKENS},GEMINI_BATCH_OCR_MAX_CARDS_PER_CALL=${_GEMINI_BATCH_OCR_MAX_CARDS_PER_CALL},GEMINI_BATCH_OCR_MAX_NEW_TOKENS=${_GEMINI_BATCH_OCR_MAX_NEW_TOKENS},GEMINI_BATCH_OCR_THINKING_BUDGET=${_GEMINI_BATCH_OCR_THINKING_BUDGET},GEMINI_WARM_ON_START=${_GEMINI_WARM_ON_START},GEMINI_NAME_CHOICE_MAX_CALLS_PER_SCREENSHOT=${_GEMINI_NAME_CHOICE_MAX_CALLS_PER_SCREENSHOT},GEMINI_UPTIE_MAX_CALLS_PER_SCREENSHOT=${_GEMINI_UPTIE_MAX_CALLS_PER_SCREENSHOT},GUNICORN_WORKERS=${_GUNICORN_WORKERS},GUNICORN_TIMEOUT=${_GUNICORN_TIMEOUT},DJANGO_SETTINGS_MODULE=${_DJANGO_SETTINGS_MODULE}
      - --set-secrets=DJANGO_SECRET_KEY=django-secret-key:latest,POSTGRES_PASSWORD=postgres-password:latest,GEMINI_API_KEY=gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/backend:${SHORT_SHA}

substitutions:
  _SERVICE_NAME: dantedoglcb-backend
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: dantedoglcb
  _CLOUD_SQL_INSTANCE: your-project:your-region:your-instance
  _DJANGO_DEBUG: 'false'
  _POSTGRES_DB: dantedoglcb
  _POSTGRES_USER: dantedoglcb
  _DJANGO_ALLOWED_HOSTS: your-service-xxxx.a.run.app
  _GOOGLE_OAUTH_CLIENT_ID: ''
  _GOOGLE_OAUTH_CLIENT_IDS: ''
  _CPU: '4'
  _MEMORY: 8Gi
  _CONCURRENCY: '1'
  _REQUEST_TIMEOUT: 300s
  _GEMINI_MODEL: gemini-3-flash-preview
  _GEMINI_MAX_NEW_TOKENS: '192'
  _GEMINI_BATCH_OCR_MAX_CARDS_PER_CALL: '6'
  _GEMINI_BATCH_OCR_MAX_NEW_TOKENS: '640'
  _GEMINI_BATCH_OCR_THINKING_BUDGET: '0'
  _GEMINI_WARM_ON_START: '0'
  _GEMINI_NAME_CHOICE_MAX_CALLS_PER_SCREENSHOT: '1'
  _GEMINI_UPTIE_MAX_CALLS_PER_SCREENSHOT: '0'
  _GUNICORN_WORKERS: '1'
  _GUNICORN_TIMEOUT: '300'
  _DJANGO_SETTINGS_MODULE: roster_sync.settings

options:
  logging: CLOUD_LOGGING_ONLY