services:
  postgres:
    image: postgres:16-alpine
    container_name: dantedoglcb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dantedoglcb}
      POSTGRES_USER: ${POSTGRES_USER:-dantedoglcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dantedoglcb}
    volumes:
      - dantedoglcb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dantedoglcb} -d
          ${POSTGRES_DB:-dantedoglcb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: dantedoglcb-frontend
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - .:/workspace
      - dantedoglcb-node-modules:/workspace/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dantedoglcb-backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dantedoglcb}
      POSTGRES_USER: ${POSTGRES_USER:-dantedoglcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dantedoglcb}
      HF_HOME: ${HF_HOME:-/models/huggingface}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-Qwen/Qwen3-VL-2B-Instruct}
      QWEN_VL_DTYPE: ${QWEN_VL_DTYPE:-auto}
      QWEN_VL_OCR_MAX_NEW_TOKENS: ${QWEN_VL_OCR_MAX_NEW_TOKENS:-80}
      QWEN_VL_CHOICE_MAX_NEW_TOKENS: ${QWEN_VL_CHOICE_MAX_NEW_TOKENS:-12}
      QWEN_VL_WARM_ON_START: ${QWEN_VL_WARM_ON_START:-0}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
    volumes:
      - ./backend:/app
      - dantedoglcb-huggingface-cache:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  dantedoglcb-postgres-data:
    external: true
  dantedoglcb-huggingface-cache:
  dantedoglcb-node-modules:
